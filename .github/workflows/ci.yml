name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with dev extras)
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest

      # Governance audit runs in report-only mode while the scaffolding is still
      # settling — findings shouldn't hard-block early commits. Flip continue-on-error
      # to false once the advisor/shadow/evals packages have stabilized.
      - name: Agent governance audit
        run: agent-governance audit
        continue-on-error: true
