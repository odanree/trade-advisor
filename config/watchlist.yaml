# Starter watchlist for the analyst pipeline. Kept to liquid, large-cap, high-coverage
# names so fundamentals/technicals/sentiment data is dependable and options-free strategy
# assumptions hold. Edit freely — the CLI reads this file at `advise` time.
tickers:
