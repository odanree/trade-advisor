  - MSFT   # Microsoft — mega-cap software/cloud
  - NVDA   # Nvidia — AI/semiconductor bellwether, high volatility
  - GOOGL  # Alphabet — search/cloud/ads
  - AMZN   # Amazon — e-commerce/AWS
  - META   # Meta Platforms — social/ads, heavy capex cycle
  - TSLA   # Tesla — EV/energy, high beta and sentiment sensitivity
  - JPM    # JPMorgan Chase — money-center bank, rate-sensitive
  - UNH    # UnitedHealth Group — managed care, regulatory sensitivity
  - XOM    # Exxon Mobil — integrated energy, commodity-price sensitive
  - AMD    # Advanced Micro Devices — semiconductors, NVDA competitor
  - SHOP   # Shopify — e-commerce platform, growth/rate sensitivity

# Same-dollar counterfactual every shadow position is benchmarked against.
benchmark: SPY
